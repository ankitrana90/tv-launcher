<html>
<head>
<meta charset="utf-8">
<script>
/* =====================================================================
   EDIT HERE. Everything you will want to change lives in this block.
   ===================================================================== */
window.LAUNCHER_CONFIG={
 /* App order, left to right. Remove an id to hide that app.
    Available ids: netflix, prime, hotstar, youtube, sony, zee, kid */
 order:["netflix","prime","hotstar","youtube","sony","zee","kid"],

 who:"Sudhir, Suman & Aaradhya",     /* welcome line */
 wLat:28.6139,wLon:77.2090,          /* weather location (Delhi) */
 aqiLat:28.4744,aqiLon:77.5040,      /* AQI location (Greater Noida) */
 aqiToken:"",aqiStation:"greater-noida"  /* optional aqicn.org token */
};
</script>
<meta name="viewport" content="width=1920,height=1080">
<title>Arctic Glass TV Launcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--ease:cubic-bezier(.22,.9,.28,1);--spark:#fff;--accent:#7aa7ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070f;color:#fff;font-family:"Fredoka","Nunito","Trebuchet MS",Arial,sans-serif}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden}

/* ---------- Level 3: atmosphere ---------- */
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1200ms ease}
.bg.on{opacity:1}
#tint{position:absolute;inset:0;background-color:var(--accent);opacity:.2;transition:background-color 1200ms ease;
 -webkit-mask-image:radial-gradient(ellipse 760px 520px at 50% 52%,#000,transparent 70%);mask-image:radial-gradient(ellipse 760px 520px at 50% 52%,#000,transparent 70%)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 1100px 640px at 50% 52%,rgba(3,6,16,.0),rgba(3,6,16,.55) 100%),linear-gradient(to bottom,rgba(3,6,16,.35),transparent 22%,transparent 70%,rgba(3,6,16,.45))}
#sparks span{position:absolute;border-radius:50%;background:var(--spark);opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(40px);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-220px);opacity:0}}

/* ---------- top: welcome + clock + pills ---------- */
#top{position:absolute;left:96px;right:96px;top:62px;display:flex;justify-content:space-between;align-items:flex-start}
#hello{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif;font-size:38px;font-weight:500;font-style:italic;color:rgba(255,255,255,.68);letter-spacing:.6px}
#hello b{display:block;font-size:74px;font-weight:600;font-style:normal;letter-spacing:-.6px;line-height:1.04;margin-top:2px;color:#fff;text-shadow:0 6px 44px rgba(0,0,0,.4)}
#clock{text-align:right}
#time{font-size:84px;font-weight:400;line-height:.95;letter-spacing:-2px}
#date{font-size:24px;color:rgba(255,255,255,.7);margin-top:8px}
#pills{display:flex;gap:16px;margin-top:24px;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:40px;font-size:30px;font-weight:500;
 background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.18)}
.pill i{font-style:normal;font-size:34px}
.dot{width:16px;height:16px;border-radius:50%;background:#888;box-shadow:0 0 14px currentColor}

/* ---------- Level 1/2: carousel ---------- */
#rail{position:absolute;left:0;top:320px;width:1920px;height:400px}
.card{position:absolute;left:790px;top:0;width:340px;height:340px;transition:transform 620ms var(--ease),opacity 620ms ease,filter 620ms ease;will-change:transform,opacity}
.face{position:relative;width:100%;height:100%;border-radius:76px;overflow:hidden;display:flex;align-items:center;justify-content:center;
 background:var(--g);box-shadow:inset 0 2px 2px rgba(255,255,255,.35),inset 0 -40px 80px rgba(0,0,0,.2),
 0 2px 6px rgba(0,0,0,.28),0 22px 40px -10px rgba(0,0,0,.35),0 60px 110px -20px rgba(0,0,0,.4);
 transition:box-shadow 500ms ease,filter 500ms ease}
.face .logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.fb{font-size:64px;font-weight:600;z-index:1}.face:before{z-index:2;content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%,rgba(0,0,0,.14));pointer-events:none}
.art{font-size:190px;line-height:1;filter:drop-shadow(0 14px 18px rgba(0,0,0,.3));transition:transform 600ms var(--ease)}
.art img{width:260px;height:260px;object-fit:contain}
.halo{position:absolute;inset:-34px;border-radius:100px;background:var(--h);filter:blur(46px);opacity:0;transition:opacity 700ms ease;z-index:-1}
.card.sel .halo{opacity:.62}
.card.sel .face{filter:saturate(1.2) brightness(1.08);box-shadow:inset 0 2px 2px rgba(255,255,255,.5),inset 0 -40px 80px rgba(0,0,0,.14),
 0 0 0 3px rgba(255,255,255,.22),0 4px 10px rgba(0,0,0,.25),0 40px 70px -14px rgba(0,0,0,.42),0 90px 150px -24px rgba(0,0,0,.5)}
.card:not(.sel) .face{filter:saturate(.8) brightness(.82)}
.float{width:100%;height:100%}
.card.sel .float{animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.012)}}
.card.sel .art.sway{animation:sway 5s ease-in-out infinite}
.card.sel .art.bob{animation:bob 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.twk{z-index:3;position:absolute;width:20px;height:20px;opacity:0;background:#fff;border-radius:50%;box-shadow:0 0 16px 6px rgba(255,255,255,.7)}
.card.sel .twk{animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1)}}
.card.go .face{animation:pulse 700ms ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(255,255,255,.28),0 0 120px 30px rgba(255,255,255,.45)}100%{transform:scale(1.03)}}

/* ---------- bottom: name + OK ---------- */
#bottom{position:absolute;left:0;width:1920px;top:790px;text-align:center}
#name{font-size:84px;font-weight:600;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.4);transition:opacity 260ms ease,transform 400ms var(--ease)}
#name.sw{opacity:0;transform:translateY(10px)}
#ok{display:inline-flex;align-items:center;gap:20px;margin-top:22px;padding:16px 46px 16px 22px;border-radius:60px;font-size:36px;font-weight:500;
 background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 16px 50px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3)}
#ok b{width:64px;height:64px;border-radius:50%;background:#fff;color:#1b2340;display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:5px}
#dots{display:flex;gap:14px;justify-content:center;margin-top:26px}
#dots i{width:14px;height:14px;border-radius:7px;background:rgba(255,255,255,.35);transition:all 500ms var(--ease)}
#dots i.on{width:44px;background:#fff}
#hint{position:absolute;right:96px;bottom:46px;font-size:24px;color:rgba(255,255,255,.55)}
#hint u{text-decoration:none;display:inline-block;padding:5px 14px;margin:0 6px 0 14px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 600ms ease;z-index:20;background:rgba(4,7,18,.78);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.ov.on{opacity:1;pointer-events:auto}
.ov h2{font-size:76px;font-weight:600;margin:0 0 50px}
#themes{display:flex;gap:30px;transition:transform 600ms var(--ease)}
.th{width:300px;height:200px;border-radius:44px;flex:0 0 300px;display:flex;align-items:flex-end;padding:18px 24px;font-size:32px;font-weight:600;position:relative;
 box-shadow:0 20px 50px rgba(0,0,0,.4);opacity:.6;transform:scale(.92);transition:transform 450ms var(--ease),opacity 450ms,box-shadow 450ms}
.th b{position:absolute;top:14px;right:22px;font-size:44px;font-weight:400}
.th.f{opacity:1;transform:scale(1.1);box-shadow:0 0 0 5px #fff,0 0 70px rgba(255,255,255,.35),0 30px 60px rgba(0,0,0,.5)}
.th.cur:after{content:"✓";position:absolute;top:10px;left:20px;font-size:40px}
#themesWrap{width:1728px;overflow:hidden;padding:30px 20px}
.row{display:flex;gap:30px;align-items:center;margin-top:34px}
#snd{padding:20px 50px;border-radius:50px;font-size:40px;background:rgba(255,255,255,.12);transition:all 400ms var(--ease)}
#snd.f{background:#fff;color:#1b2340;transform:scale(1.08);box-shadow:0 0 60px rgba(255,255,255,.35)}
.sub{font-size:26px;color:rgba(255,255,255,.55);margin-top:34px}

/* loading */
#load{background:rgba(4,7,18,.9)}
#load .big{font-size:200px;animation:bob 2s ease-in-out infinite}
#load .st{position:absolute;font-size:46px;animation:orbit 3.2s ease-in-out infinite}
@keyframes orbit{0%,100%{transform:translateY(0) scale(.7);opacity:.3}50%{transform:translateY(-30px) scale(1);opacity:1}}
/* error / empty */
.bigbtn{margin-top:46px;padding:26px 90px;border-radius:70px;font-size:56px;font-weight:600;background:#fff;color:#1b2340;box-shadow:0 0 0 6px rgba(255,255,255,.3),0 0 80px rgba(255,255,255,.35);animation:breathe 4s ease-in-out infinite}
.ov .msg{font-size:84px;font-weight:600}
.ov .face2{font-size:210px;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
 <div id="bgs"></div><div id="tint"></div><div id="sparks"></div><div id="vig"></div>

 <div id="top">
  <div id="hello">Welcome<b id="who"></b></div>
  <div id="clock"><div id="time">--:--</div><div id="date"></div>
   <div id="pills"><div class="pill"><i id="wi">🌤️</i><span id="wt">--°</span></div><div class="pill"><span class="dot" id="adot"></span><span id="at">AQI --</span></div></div>
  </div>
 </div>

 <div id="rail"></div>
 <div id="bottom"><div id="name"></div><div id="ok"><b>▶</b>Watch</div><div id="dots"></div></div>
 <div id="hint">Press <u>▲</u> for colours</div>

 <div class="ov" id="set"><h2>Pick a world ✨</h2>
  <div id="themesWrap"><div id="themes"></div></div>
  <div class="row"><div id="snd"></div></div>
  <div class="sub">◀ ▶ choose &nbsp; OK pick &nbsp; BACK close</div></div>

 <div class="ov" id="load"><div class="big" id="lart"></div><span class="st" style="left:700px;top:300px">✨</span><span class="st" style="left:1180px;top:340px;animation-delay:.6s">⭐</span><span class="st" style="left:820px;top:720px;animation-delay:1.1s">✨</span><span class="st" style="left:1100px;top:700px;animation-delay:1.6s">⭐</span></div>

 <div class="ov" id="err"><div class="face2">🧸</div><div class="msg">Oops! Let's try again 💕</div><div class="bigbtn">TRY AGAIN</div></div>
 <div class="ov" id="none"><div class="face2">📺</div><div class="msg">Nothing here yet!</div></div>
</div>

<script>
(function(){
"use strict";
/* ============ CONFIG ============ */
var CONFIG=window.LAUNCHER_CONFIG;
/* ids = webOS app ids tried in order (same proven list as before). Icon files: assets/icons/<id>.png (official, preferred) then <id>.svg (stand-in). */
var CHANNELS=[
 {id:"netflix",title:"Netflix",ids:"netflix",g:"linear-gradient(145deg,#36070b,#090a0d)",h:"#e50914"},
 {id:"prime",title:"Prime Video",ids:"amazon,amazon-webos,primevideo",g:"linear-gradient(145deg,#0b3550,#07131c)",h:"#27a8ff"},
 {id:"hotstar",title:"JioHotstar",ids:"hotstar,jiohotstar,com.jio.hotstar",g:"linear-gradient(145deg,#27104e,#0b0920)",h:"#a56bff"},
 {id:"youtube",title:"YouTube",ids:"youtube.leanback.v4,youtube",g:"linear-gradient(145deg,#3a0808,#100707)",h:"#ff3131"},
 {id:"sony",title:"SonyLIV",ids:"com.sonyliv2.tvapp,com.sonyliv,sonylive,sonlylive,sonyliv",g:"linear-gradient(145deg,#17133d,#090918)",h:"#a998ff"},
 {id:"zee",title:"ZEE5",ids:"com.zee5.app,com.zee5,zee5,z5",g:"linear-gradient(145deg,#351052,#12091a)",h:"#d784ff"},
 {id:"kid",title:"Kid TV",ids:"com.family.kidtv",g:"linear-gradient(145deg,#5c2a62,#1c102c)",h:"#ff8ad8"}
];
var ALL=CHANNELS;CHANNELS=(CONFIG.order||[]).map(function(id){return ALL.filter(function(c){return c.id===id})[0]}).filter(Boolean);
var THEMES=[
 {n:"Night Sky",e:"🌌",bg:"linear-gradient(160deg,#0a1030,#1b1f55 55%,#0b0f2a)",sp:"#cfe0ff"},
 {n:"Forest",e:"🌲",bg:"linear-gradient(160deg,#06231f,#0f4a3c 55%,#07201c)",sp:"#d9ffb0"},
 {n:"Christmas",e:"🎄",bg:"linear-gradient(160deg,#2a0a12,#0e3a2c 60%,#1c0810)",sp:"#ffe7a0"},
 {n:"Diwali",e:"🪔",bg:"linear-gradient(160deg,#2b0f3f,#6a2250 55%,#2a0d22)",sp:"#ffcf70"},
 {n:"Space",e:"🪐",bg:"linear-gradient(160deg,#04040f,#1a0f3d 55%,#070516)",sp:"#fff"},
 {n:"Castle",e:"🏰",bg:"linear-gradient(160deg,#2a1450,#7b3a8f 55%,#2a1248)",sp:"#ffd6f6"},
 {n:"Dream",e:"☁️",bg:"linear-gradient(160deg,#101a3e,#31407c 55%,#16204a)",sp:"#e6eaff"},
 {n:"Clean",e:"◐",bg:"linear-gradient(160deg,#0b0e14,#171c27 55%,#0b0e14)",sp:"#9fb4d8"}
];
var $=function(i){return document.getElementById(i)};
var store={get:function(k,d){try{var v=localStorage.getItem("tvl."+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem("tvl."+k,JSON.stringify(v))}catch(e){}}};
var idx=0,mode="home",themeIdx=store.get("theme",0),focusTheme=themeIdx,sound=store.get("sound",true),setRow=0,busy=false,lastErrFn=null;
var bridge=typeof PalmServiceBridge!=="undefined";

/* ============ build UI ============ */
$("who").textContent=CONFIG.who;
var rail=$("rail"),dots=$("dots"),cards=[];
CHANNELS.forEach(function(c,i){
 var d=document.createElement("div");d.className="card";
 d.innerHTML='<div class="halo" style="--h:'+c.h+'"></div><div class="float"><div class="face" style="--g:'+c.g+'"><img class="logo" alt=""><span class="fb" style="display:none">'+c.title+'</span><span class="twk" style="left:60px;top:70px"></span><span class="twk" style="right:56px;top:120px;animation-delay:1.4s"></span><span class="twk" style="left:90px;bottom:80px;animation-delay:2.4s"></span></div></div>';
 (function(im,fb,id){var n=0,src=["assets/icons/"+id+".png","assets/icons/"+id+".svg"];im.onerror=function(){if(n<src.length){im.src=src[n++]}else{im.style.display="none";fb.style.display="block"}};im.onerror()})(d.querySelector("img"),d.querySelector(".fb"),c.id);
 rail.appendChild(d);cards.push(d);
 var p=document.createElement("i");dots.appendChild(p);
});
if(!CHANNELS.length){show("none")}
THEMES.forEach(function(t,i){
 var b=document.createElement("div");b.className="th";b.style.background=t.bg;b.innerHTML='<b>'+t.e+'</b>'+t.n;$("themes").appendChild(b);
});
var bgs=[];THEMES.forEach(function(t){var b=document.createElement("div");b.className="bg";b.style.background=t.bg;$("bgs").appendChild(b);bgs.push(b)});
for(var s=0;s<26;s++){var sp=document.createElement("span"),z=3+Math.random()*7;sp.style.cssText="left:"+Math.random()*100+"%;top:"+(40+Math.random()*60)+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(7+Math.random()*9)+"s;animation-delay:-"+Math.random()*12+"s";$("sparks").appendChild(sp)}

/* ============ sound (soft, short) ============ */
var ac=null;
function tone(f,t0,dur,vol){
 if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type="sine";o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}
}
var sfx={tick:function(){tone(880,0,.14,.035);tone(1320,.03,.12,.015)},ok:function(){tone(523,0,.3,.05);tone(784,.09,.4,.045)},play:function(){tone(659,0,.35,.04);tone(880,.1,.35,.035);tone(1175,.2,.5,.03)}};

/* ============ carousel layout ============ */
var X=[0,395,655,820],S=[1,.8,.62,.5],O=[1,.92,.7,.45];
function layout(){
 cards.forEach(function(c,i){
  var o=i-idx,a=Math.abs(o),k=Math.min(a,3),sg=o<0?-1:1;
  var x=a>3?sg*(X[3]+120):sg*X[k],sc=a>3?.4:S[k],op=a>3?0:O[k];
  c.style.transform="translate3d("+x+"px,"+(k===0?0:40)+"px,0) scale("+sc+")";
  c.style.opacity=op;c.style.zIndex=10-a;
  c.classList.toggle("sel",o===0);
  if(o!==0)c.classList.remove("go");
 });
 [].forEach.call(dots.children,function(d,i){d.className=i===idx?"on":""});
 var ch=CHANNELS[idx];if(!ch)return;
 var n=$("name");n.classList.add("sw");
 setTimeout(function(){n.textContent=ch.title;n.classList.remove("sw")},180);
 document.documentElement.style.setProperty("--accent",ch.h);
}
function applyTheme(i){
 themeIdx=i;bgs.forEach(function(b,j){b.classList.toggle("on",j===i)});
 document.documentElement.style.setProperty("--spark",THEMES[i].sp);
 [].forEach.call($("themes").children,function(t,j){t.classList.toggle("cur",j===i)});
 store.set("theme",i);
}
function showFocusTheme(){
 [].forEach.call($("themes").children,function(t,j){t.classList.toggle("f",setRow===0&&j===focusTheme)});
 $("snd").classList.toggle("f",setRow===1);
 var shift=Math.max(0,Math.min(focusTheme-2,THEMES.length-5))*330;
 $("themes").style.transform="translateX("+(-shift)+"px)";
}
function renderSnd(){$("snd").textContent=sound?"🔔 Sounds on":"🔕 Sounds off"}

/* ============ overlays ============ */
function show(id){$(id).classList.add("on")}
function hide(id){$(id).classList.remove("on")}

/* ============ launching (also the hook for phase 2) ============ */
function luna(uri,p,cb){try{var b=new PalmServiceBridge();b.onservicecallback=function(m){var r;try{r=JSON.parse(m)}catch(e){r={returnValue:false}}cb(r)};b.call(uri,JSON.stringify(p||{}))}catch(e){cb({returnValue:false})}}
function launch(appIds,params,done){
 var i=0;(function next(){
  if(i>=appIds.length)return done(false);var cur=appIds[i];
  var p={id:appIds[i++]};if(params&&Object.keys(params).length)p.params=params;
  luna("luna://com.webos.applicationManager/launch",p,function(r){r.returnValue===false?next():done(true,cur)});
 })();
}
var KEY="tvlauncher.ids.v2",saved=store.get("x",null)||{};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
function idList(ch){var l=ch.ids.split(","),s=saved[ch.title];return s?[s].concat(l.filter(function(x){return x!==s})):l}
function play(ch){
 if(busy||!ch)return;busy=true;sfx.ok();
 cards[idx].classList.add("go");
 setTimeout(function(){
  sfx.play();var im=cards[idx].querySelector("img");
  $("lart").innerHTML=im.style.display==="none"?ch.title:'<img src="'+im.src+'" style="width:230px;height:230px;border-radius:52px">';
  show("load");
  var t0=Date.now();
  var finish=function(ok,usedId){
   if(ok&&usedId){saved[ch.title]=usedId;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
   var wait=Math.max(0,1400-(Date.now()-t0));
   setTimeout(function(){
    hide("load");busy=false;cards[idx].classList.remove("go");
    if(!ok){show("err");mode="err";lastErrFn=function(){play(ch)}}
   },wait);
  };
  if(!bridge){finish(true)}else{launch(idList(ch),ch.params,finish)}
 },450);
}
/* Phase 2 entry points: window.TVL.go("rhymes"), window.TVL.launchApp(["netflix"],{...}) */
window.TVL={
 go:function(id){for(var i=0;i<CHANNELS.length;i++)if(CHANNELS[i].id===id){idx=i;layout();play(CHANNELS[i]);return true}return false},
 launchApp:function(ids,params,cb){launch(ids,params,cb||function(){})},
 channels:CHANNELS
};

/* ============ remote ============ */
document.addEventListener("keydown",function(e){
 var k=e.keyCode;if(busy&&mode==="home")return;
 var h=false;
 if(mode==="home"){
  if(k===37||k===33){if(idx>0){idx--;layout();sfx.tick()}h=true}
  else if(k===39||k===34){if(idx<CHANNELS.length-1){idx++;layout();sfx.tick()}h=true}
  else if(k===13){play(CHANNELS[idx]);h=true}
  else if(k===38){mode="set";setRow=0;focusTheme=themeIdx;show("set");showFocusTheme();sfx.tick();h=true}
 }else if(mode==="set"){
  if(k===37&&setRow===0){focusTheme=Math.max(0,focusTheme-1);sfx.tick();h=true}
  else if(k===39&&setRow===0){focusTheme=Math.min(THEMES.length-1,focusTheme+1);sfx.tick();h=true}
  else if(k===40){setRow=1;sfx.tick();h=true}
  else if(k===38){setRow=0;sfx.tick();h=true}
  else if(k===13){
   if(setRow===0){applyTheme(focusTheme)}else{sound=!sound;store.set("sound",sound);renderSnd()}
   sfx.ok();h=true}
  else if(k===461||k===27||k===8||k===10009){mode="home";hide("set");h=true}
  if(h)showFocusTheme();
 }else if(mode==="err"){
  if(k===13){hide("err");mode="home";if(lastErrFn)lastErrFn()}
  else if(k===461||k===27||k===8||k===10009){hide("err");mode="home"}
  h=true;
 }
 if(h)e.preventDefault();
});

/* ============ clock, weather, AQI ============ */
function tick(){
 var d=new Date(),h=d.getHours()%12||12,m=("0"+d.getMinutes()).slice(-2);
 $("time").textContent=h+":"+m;
 $("date").textContent=d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
}
function wIcon(c){return c===0?"☀️":c<3?"🌤️":c===3?"☁️":c<50?"🌫️":c<70?"🌧️":c<80?"❄️":"⛈️"}
function getJSON(u,cb){var x=new XMLHttpRequest();x.open("GET",u);x.timeout=15000;x.onload=function(){try{cb(JSON.parse(x.responseText))}catch(e){}};x.send()}
function weather(){getJSON("https://api.open-meteo.com/v1/forecast?latitude="+CONFIG.wLat+"&longitude="+CONFIG.wLon+"&current=temperature_2m,weather_code&timezone=Asia%2FKolkata",function(r){
 if(r.current){$("wt").textContent=Math.round(r.current.temperature_2m)+"°C";$("wi").textContent=wIcon(r.current.weather_code)}})}
function showAqi(v){
 var c=v<=50?["#52e08a","😊"]:v<=100?["#ffd84d","🙂"]:v<=150?["#ff9f45","😷"]:v<=200?["#ff5a5a","😷"]:["#b05bff","😷"];
 $("adot").style.background=c[0];$("adot").style.color=c[0];$("at").textContent=c[1]+" AQI "+Math.round(v);
}
function aqi(){
 /* aqi.in has no browser-readable API; default source is Open-Meteo air quality (US AQI) for Greater Noida.
    If you set CONFIG.aqiToken (free from aqicn.org) that feed is used instead. */
 if(CONFIG.aqiToken){getJSON("https://api.waqi.info/feed/"+CONFIG.aqiStation+"/?token="+CONFIG.aqiToken,function(r){if(r.status==="ok")showAqi(r.data.aqi)});return}
 getJSON("https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+CONFIG.aqiLat+"&longitude="+CONFIG.aqiLon+"&current=us_aqi",function(r){if(r.current&&r.current.us_aqi!=null)showAqi(r.current.us_aqi)});
}

renderSnd();applyTheme(themeIdx);layout();tick();setInterval(tick,10000);
weather();aqi();setInterval(function(){weather();aqi()},900000);
})();
</script>
